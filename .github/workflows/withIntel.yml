name: Fortran CI_Intel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        compiler: [gfortran]   # 基础列表，其余通过 include 添加
        include:
          - compiler: gfortran
            install-cmd: sudo apt-get update && sudo apt-get install -y gfortran
            compile-flags: -Wall -Wextra -std=f2008
          - compiler: flang-new
            install-cmd: |
              sudo apt-get update
              sudo apt-get install -y clang flang
            compile-flags: -Wall
          # ----- 新增 Intel ifx 编译器 -----
          - compiler: ifx
            install-cmd: |
              # 添加 Intel oneAPI APT 仓库（现代方法，避免 apt-key 弃用警告）
              wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
              echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
              sudo apt-get update
              sudo apt-get install -y intel-oneapi-compiler-fortran
              # 将 ifx 所在目录加入 PATH（无需手动 source setvars.sh）
              echo "/opt/intel/oneapi/compiler/latest/linux/bin/intel64" >> $GITHUB_PATH
            compile-flags: -warn all -stand f18

    name: Test with ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    # 允许 flang-new（实际条件永远为 false）和 ifx 失败而不影响 CI 状态
    continue-on-error: ${{ matrix.compiler == 'flang' || matrix.compiler == 'ifx' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ${{ matrix.compiler }}
      run: ${{ matrix.install-cmd }}

    - name: Compile Fortran files
      run: |
        for f in *.f90 *.f95 *.f03; do
          if [ -f "$f" ]; then
            out="${f%.*}"
            echo "Compiling $f → $out"
            ${{ matrix.compiler }} ${{ matrix.compile-flags }} -o "$out" "$f" || continue
          fi
        done

    - name: Run executables
      run: |
        for exe in $(ls -F | grep '*$' | sed 's/*$//'); do
          if [ -x "$exe" ]; then
            echo "Running $exe:"
            timeout 5 ./"$exe" || echo "Execution timed out or failed"
            echo ""
          fi
        done

    - name: Summary
      run: |
        echo "✅ ${{ matrix.compiler }} test completed"
        echo "Compiler: ${{ matrix.compiler }}"
        echo "OS: ${{ runner.os }}"
        echo "Time: $(date -u)"
